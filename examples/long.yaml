version: 1

workers:
  - name: local
    host: 127.0.0.1
    port: 8787

defaults:
  model: opencode-go/deepseek-v4.1-flash
  auto: true

tasks:
  - id: long-task
    prompt: "Run the shell command sleep 120 and then reply DONE."
    timeout_s: 300
    download: none

  - id: after
    prompt: "Reply with exactly: AFTER"
    depends_on: [long-task]
    download: none
