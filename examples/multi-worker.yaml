version: 1

# Multiple workers are declared in workers.yaml; independent tasks run in
# parallel, one per free worker.

defaults:
  model: opencode-go/deepseek-v4.1-flash
  auto: true
  timeout_s: 300
  poll_interval_s: 2

tasks:
  - id: m1
    prompt: "Reply with exactly: M1"
    download: none

  - id: m2
    prompt: "Reply with exactly: M2"
    download: none

  - id: m3
    prompt: "Reply with exactly: M3"
    download: none

  - id: m4
    prompt: "Reply with exactly: M4"
    download: none
